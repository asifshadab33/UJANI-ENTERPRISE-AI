[package]
name = "ujani-enterprise-policy"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Illustrative admission policy types for UJANI Enterprise AI"

[lib]
path = "src/lib.rs"

[dependencies]
ed25519-dalek = "3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
serde_json = "1"
hmac = "0.13"
zeroize = "1"
