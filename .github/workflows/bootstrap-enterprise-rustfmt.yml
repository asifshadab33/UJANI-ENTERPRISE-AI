name: Format Enterprise Rust provider (temporary)

on:
  push:
    branches:
      - feat/enterprise-os-keyring-integrity-provider-2026-11-25

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'asifshadab33'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Format Rust sources and commit formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/ujani-enterprise-policy/src/lib.rs crates/ujani-enterprise-policy/src/os_keyring_integrity_provider.rs
            git commit -m "style: format OS keyring provider"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
