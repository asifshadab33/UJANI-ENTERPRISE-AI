name: UJANI Enterprise AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: enterprise-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-tests:
    name: Enterprise policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lint warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
