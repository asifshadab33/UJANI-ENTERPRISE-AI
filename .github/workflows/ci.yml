name: UJANI Enterprise AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Repeat the complete validation suite every 30 minutes (UTC).
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'schedule' && format('enterprise-policy-schedule-{0}', github.run_id) || format('enterprise-policy-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  policy-tests:
    name: Enterprise policy tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # pinned setup-python action
        with:
          python-version: "3.12"
      - name: Install pinned JSON Schema validation dependencies
        run: python -m pip install --disable-pip-version-check --no-input --requirement scripts/requirements-schema.txt
      - name: Validate collective-defence event schema contract
        run: python scripts/validate_security_event_schema.py
      - name: Validate model/runtime inventory v1 schema
        run: python scripts/validate_model_runtime_inventory_schema.py
      - name: Validate Personal-to-Enterprise task contract v1
        run: python scripts/validate_personal_enterprise_task_contract.py
      - name: Validate read-only operator console
        run: python scripts/validate_operator_console.py
      - name: Validate customer-hosted tenant database migration
        run: python scripts/validate_customer_hosted_migration.py
      - name: Check operator console JavaScript syntax
        run: node --check apps/operator-console/app.js
      - name: Test local read-only network log adapters and admission policies
        run: python -m unittest discover -s tests -v
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lint warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  customer-hosted-database-tests:
    name: Customer-hosted PostgreSQL tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ujani_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ujani_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply customer-hosted control-plane migration
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file migrations/0001_customer_hosted_control_plane.sql
      - name: Verify tenant isolation and append-only audit behavior
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file scripts/test_customer_hosted_migration.sql
