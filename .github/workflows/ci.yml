name: UJANI Enterprise AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Repeat the complete validation suite every 30 minutes (UTC).
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'schedule' && format('enterprise-policy-schedule-{0}', github.run_id) || format('enterprise-policy-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  policy-tests:
    name: Enterprise policy tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # pinned setup-python action
        with:
          python-version: "3.12"
      - name: Validate collective-defence event schema contract
        run: python scripts/validate_security_event_schema.py
      - name: Test local read-only network log adapters
        run: python -m unittest discover -s tests -v
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lint warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
