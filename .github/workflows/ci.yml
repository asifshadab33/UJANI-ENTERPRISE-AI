name: UJANI Enterprise AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Repeat the complete validation suite every 30 minutes (UTC).
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'schedule' && format('enterprise-policy-schedule-{0}', github.run_id) || format('enterprise-policy-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  policy-tests:
    name: Enterprise policy tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # pinned setup-python action
        with:
          python-version: "3.12"
      - name: Install pinned JSON Schema validation dependencies
        run: python -m pip install --disable-pip-version-check --no-input --requirement scripts/requirements-schema.txt
      - name: Validate collective-defence event schema contract
        run: python scripts/validate_security_event_schema.py
      - name: Check model catalogue mirror parity
        run: python3 scripts/check_model_catalogue_parity.py
      - name: Test model catalogue parity guard
        run: python3 -m unittest discover -s scripts -p 'test_model_catalogue_parity.py' -v
      - name: Validate model/runtime inventory v1 schema
        run: python scripts/validate_model_runtime_inventory_schema.py
      - name: Validate Personal-to-Enterprise task contract v1
        run: python scripts/validate_personal_enterprise_task_contract.py
      - name: Validate operator model/runtime inventory v2 projection schema
        run: python scripts/validate_operator_model_runtime_inventory_v2_projection.py
      - name: Validate read-only operator console
        run: python scripts/validate_operator_console.py
      - name: Validate existing security-provider inventory v1 schema
        run: python scripts/validate_security_provider_inventory_schema.py
      - name: Validate customer-hosted tenant database migration
        run: python scripts/validate_customer_hosted_migration.py
      - name: Check operator console JavaScript syntax
        run: node --check apps/operator-console/app.js
      - name: Test operator console demo-to-live transition
        run: node --test apps/operator-console/tests/demo-transition.test.mjs
      - name: Test bounded operator console JSON parsing
        run: node --test apps/operator-console/tests/bounded-json.test.mjs
      - name: Test local read-only network log adapters
        run: python -m unittest discover -s tests -v
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lint warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  customer-hosted-database-tests:
    name: Customer-hosted PostgreSQL tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ujani_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d ujani_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare PostgreSQL client from service container
        shell: bash
        run: |
          container_id="$(docker ps --filter "ancestor=postgres:16" --format '{{.ID}}' | head -n1)"
          test -n "$container_id"
          cat > "$RUNNER_TEMP/ujani-psql" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          docker exec -i \
            -e "PGPASSWORD=${PGPASSWORD:-postgres}" \
            -e "PGAPPNAME=${PGAPPNAME:-}" \
            -e "UJANI_ADMISSION_RELEASE_FILE=${UJANI_ADMISSION_RELEASE_FILE:-}" \
            -e "UJANI_TELEMETRY_RELEASE_FILE=${UJANI_TELEMETRY_RELEASE_FILE:-}" \
            "${POSTGRES_CONTAINER_ID:?}" psql "$@"
          EOF
          chmod +x "$RUNNER_TEMP/ujani-psql"
          echo "POSTGRES_CONTAINER_ID=$container_id" >> "$GITHUB_ENV"
          echo "PSQL_BIN=$RUNNER_TEMP/ujani-psql" >> "$GITHUB_ENV"
      - name: Apply customer-hosted control-plane migration
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0001_customer_hosted_control_plane.sql
      - name: Apply shared task-contract replay migration
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0002_task_contract_replay_storage.sql
      - name: Verify tenant isolation and append-only audit behavior
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < scripts/test_customer_hosted_migration.sql
      - name: Verify task replay and monotonic sequence isolation
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < scripts/test_task_contract_replay_migration.sql
      - name: Apply monotonic device telemetry migration
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0003_monotonic_device_telemetry.sql
      - name: Verify monotonic telemetry admission and transaction rollback
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < scripts/test_monotonic_device_telemetry.sql
      - name: Verify concurrent monotonic telemetry serialization
        env:
          PGPASSWORD: postgres
          PGUSER: postgres
          PGDATABASE: ujani_test
        run: bash scripts/test_monotonic_device_telemetry_concurrency.sh
      - name: Apply tenant-scoped audit hash-chain migration
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0004_audit_event_hash_chain.sql
      - name: Verify tenant-scoped audit hash-chain writes
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < scripts/test_audit_event_hash_chain.sql
      - name: Verify concurrent audit hash-chain serialization
        env:
          PGPASSWORD: postgres
          PGUSER: postgres
          PGDATABASE: ujani_test
        run: bash scripts/test_audit_event_hash_chain_concurrency.sh
      - name: Apply operator session revocation migration
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0005_operator_session_revocations.sql
      - name: Verify tenant-isolated operator session revocation
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < scripts/test_operator_session_revocations.sql
      - name: Apply Self-Evolution approval replay migration
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0006_self_evolution_approval_replay.sql
      - name: Verify tenant-isolated single-use Self-Evolution approval consumption
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < scripts/test_self_evolution_approval_replay.sql
      - name: Apply atomic Self-Evolution approval consumption function
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0007_self_evolution_approval_consumption_function.sql
      - name: Verify atomic Self-Evolution approval consumption
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < scripts/test_self_evolution_approval_consumption_function.sql
      - name: Verify approval expiry after concurrent nonce-lock wait
        env:
          PGPASSWORD: postgres
          PGUSER: postgres
          PGDATABASE: ujani_test
        run: bash scripts/test_self_evolution_approval_consumption_concurrency.sh
      - name: Apply atomic device lease admission migration
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0008_atomic_device_lease_admission.sql
      - name: Verify atomic device lease admission and rollback
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < scripts/test_atomic_device_lease_admission.sql
      - name: Verify concurrent admission cannot oversubscribe device capacity
        env:
          PGPASSWORD: postgres
          PGUSER: postgres
          PGDATABASE: ujani_test
        run: bash scripts/test_atomic_device_lease_admission_concurrency.sh
      - name: Verify monotonic telemetry v2 admission and transaction rollback
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < scripts/test_monotonic_device_telemetry_v2.sql
      - name: Verify concurrent monotonic telemetry v2 serialization
        env:
          PGPASSWORD: postgres
          PGUSER: postgres
          PGDATABASE: ujani_test
        run: bash scripts/test_monotonic_device_telemetry_v2_concurrency.sh
      - name: Apply shared task-contract replay helper functions
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0009_task_contract_replay_functions.sql
      - name: Verify atomic task-contract replay and sequence helpers
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < scripts/test_task_contract_replay_functions.sql
      - name: Verify replay-claim expiry after a conflicting transaction wait
        env:
          PGPASSWORD: postgres
          PGUSER: postgres
          PGDATABASE: ujani_test
        run: bash scripts/test_task_contract_replay_expiry_concurrency.sh

      - name: Apply atomic telemetry-plus-lease admission migration
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0010_atomic_telemetry_lease_admission.sql
      - name: Persist lease approval references
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0011_persist_lease_approval_reference.sql
      - name: Retain request digest and create tenant-scoped lease audit query
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0012_lease_audit_evidence_view.sql
      - name: Revoke leases when owner consent is paused or withdrawn
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0013_revoke_leases_on_owner_consent_change.sql
      - name: Verify atomic telemetry-plus-lease admission and rollback
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < scripts/test_atomic_telemetry_lease_admission.sql
      - name: Verify owner-consent withdrawal revokes leases and later grant does not reactivate
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < scripts/test_owner_consent_lease_revocation.sql
      - name: Verify concurrent atomic telemetry-plus-lease admission serialization
        env:
          PGPASSWORD: postgres
          PGUSER: postgres
          PGDATABASE: ujani_test
        run: bash scripts/test_atomic_telemetry_lease_admission_concurrency.sh

      - name: Apply atomic model inventory v2 admission migration
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0014_atomic_model_inventory_v2_admission.sql
      - name: Verify model inventory v2 consent, replay, freshness and rollback
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < scripts/test_model_inventory_v2_admission.sql
      - name: Apply transactional lease lifecycle migration
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0015_transactional_lease_lifecycle.sql
      - name: Verify transactional lease renewal, release, rollback and capacity accounting
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < scripts/test_transactional_lease_lifecycle.sql
      - name: Verify owner-consent withdrawal serializes against lease renewal
        env:
          PGPASSWORD: postgres
          PGUSER: postgres
          PGDATABASE: ujani_test
        run: bash scripts/test_owner_consent_renewal_concurrency.sh
      - name: Verify concurrent lease expiry reconciliation
        env:
          PGPASSWORD: postgres
          PGUSER: postgres
          PGDATABASE: ujani_test
        run: bash scripts/test_lease_expiry_concurrency.sh
      - name: Apply generation-bound authenticated telemetry admission migration
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0016_authenticated_device_telemetry_v3.sql
      - name: Verify authenticated telemetry consent, replay, freshness and rollback
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < scripts/test_authenticated_device_telemetry_v3.sql
      - name: Verify concurrent authenticated telemetry admission serialization
        env:
          PGPASSWORD: postgres
          PGUSER: postgres
          PGDATABASE: ujani_test
        run: bash scripts/test_authenticated_device_telemetry_v3_concurrency.sh

      - name: Apply atomic telemetry-plus-lease lock-order correction
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0017_atomic_telemetry_lease_lock_order.sql
      - name: Verify owner-consent withdrawal serializes against atomic admission
        env:
          PGPASSWORD: postgres
          PGUSER: postgres
          PGDATABASE: ujani_test
        run: bash scripts/test_owner_consent_admission_concurrency.sh
      - name: Apply durable Collective Defence dual-consent migration
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0018_durable_collective_defence_consent.sql
      - name: Verify durable Collective Defence dual opt-in, revocation, idempotency and audit chain
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < scripts/test_durable_collective_defence_consent.sql
      - name: Apply device-authority lease revocation migration
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < migrations/0019_revoke_leases_on_device_authority_change.sql
      - name: Verify trust, owner consent, key and administrator revocation release leases atomically
        env:
          PGPASSWORD: postgres
        run: |
          "$PSQL_BIN" --username postgres --dbname ujani_test --set ON_ERROR_STOP=1 --file - < scripts/test_device_authority_lease_revocation.sql
