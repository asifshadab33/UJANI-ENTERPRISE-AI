name: One-time Rust formatting remediation

on:
  push:
    branches:
      - audit/approval-leases-hardening-2026-11
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/approval-leases-hardening-2026-11
      - name: Install stable Rust formatter
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ujani-enterprise-policy/src/lib.rs
          git commit -m "style(policy): apply rustfmt to enterprise policy remediation"
          git push origin HEAD:audit/approval-leases-hardening-2026-11
