name: Format enterprise ledger changes

on:
  push:
    branches:
      - security/keyed-durable-ledger-integrity

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore: format enterprise ledger changes')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          if git diff --cached --quiet; then
            echo "Rust workspace is already formatted."
            exit 0
          fi
          git commit -m "chore: format enterprise ledger changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
